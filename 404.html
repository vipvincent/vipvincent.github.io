<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Redirecting...</title>
        <script>
            (function () {
                var siteMain = "https://vipvincent.com";
                var siteDocs = "https://docs.vipvincent.com";

                var pathname = window.location.pathname || "/";
                var search = window.location.search || "";
                var hash = window.location.hash || "";

                var match = pathname.match(/^\/(?:docs|wiki)(.*)$/);

                if (match) {
                    var rest = match[1] || "/";
                    if (!rest.startsWith("/")) {
                    rest = "/" + rest;
                    }
                    var targetUrl = siteDocs + rest + search + hash;
                    window.location.replace(targetUrl);
                    } else {
                    window.location.replace(siteMain + "/");
                }
            })();
        </script>
    </head>
    <body>
        <p>Redirecting...</p>
        <noscript>
            <p>Your browser has JavaScript disabled. Please visit <a href="https://vipvincent.com/">vipvincent.com</a> manually.</p>
        </noscript>
    </body>
</html>
